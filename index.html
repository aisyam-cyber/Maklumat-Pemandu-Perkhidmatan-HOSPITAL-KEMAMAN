<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pengurusan Lesen Vokasional KKM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: white; padding: 0; }
      .print-area { width: 100% !important; margin: 0 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- MODAL LOG MASUK -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-200">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Log Masuk Sistem</h2>
        <p class="text-xs text-slate-500 mt-1">Sistem Lesen Vokasional Pemandu KKM</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">ID Pengguna / Username</label>
          <input type="text" id="loginUsername" placeholder="Contoh: admin / ID Pemandu" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Kata Laluan</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="loginError" class="text-rose-600 text-xs font-semibold hidden">
          ID Pengguna atau Kata Laluan Salah!
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
          Log Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- APLIKASI UTAMA -->
  <div id="appContainer" class="hidden flex flex-col md:flex-row min-h-screen">
    
    <!-- SIDEBAR ANALITIK (UNTUK PENYELIA SAHAJA) -->
    <aside id="sidebarAnalitik" class="w-full md:w-80 bg-slate-900 text-white p-6 no-print flex-col justify-between hidden md:flex">
      <div>
        <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-6">
          <h1 class="text-xl font-bold text-blue-400">📊 Analitik Data</h1>
          <button onclick="kemaskiniDashboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-600">🔄 Muat Semula</button>
        </div>

        <div class="space-y-4">
          <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <p class="text-xs text-slate-400 uppercase font-semibold">Jumlah Pemandu Berdaftar</p>
            <p id="statJumlahPemandu" class="text-2xl font-bold text-white">0</p>
          </div>

          <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <p class="text-xs text-slate-400 uppercase font-semibold">Memandu Ambulans Gantian</p>
            <p id="statAmbulansGantian" class="text-2xl font-bold text-emerald-400">0</p>
          </div>

          <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <p class="text-xs text-slate-400 uppercase font-semibold">Belum Ada Lesen Vokasional</p>
            <p id="statTiadaLesen" class="text-2xl font-bold text-amber-400">0</p>
          </div>

          <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
            <p class="text-xs text-slate-400 uppercase font-semibold">Lesen Tamat Tempoh</p>
            <p id="statLesenLuput" class="text-2xl font-bold text-rose-400">0</p>
          </div>
        </div>
      </div>

      <div class="mt-8 space-y-3 pt-4 border-t border-slate-700">
        <button onclick="muatTurunAnalitik()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded flex items-center justify-center gap-2 transition">
          📥 Muat Turun Ringkasan (CSV)
        </button>
        <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded flex items-center justify-center gap-2 transition">
          🖨️ Cetak Laporan Analisis
        </button>
      </div>
    </aside>

    <!-- BORANG PEMANDU -->
    <main class="flex-1 p-6 print-area">
      <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
        
        <div class="flex justify-between items-center mb-6 border-b pb-4">
          <div>
            <h2 class="text-2xl font-bold text-slate-800">Pendaftaran Pemandu & Lesen Vokasional</h2>
            <p class="text-xs text-slate-500 mt-1">Rujukan: KKM.600-27/12/2 JLD. 19 (15)</p>
          </div>
          <div class="text-right no-print">
            <p id="userNamaDisplay" class="text-sm font-bold text-slate-700"></p>
            <button onclick="logKeluar()" class="text-xs text-rose-600 hover:underline">Log Keluar</button>
          </div>
        </div>

        <form id="pemanduForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">ID Pemandu / No. Pekerja</label>
              <input type="text" id="idPemandu" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Nama Penuh</label>
              <input type="text" id="nama" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">No. Kad Pengenalan</label>
              <input type="text" id="noKP" placeholder="880101015555" required class="w-full border p-2 rounded">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">No. Telefon Pemandu</label>
              <input type="text" id="noTel" placeholder="0123456789" required class="w-full border p-2 rounded">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Emel Rasmi</label>
              <input type="email" id="emel" placeholder="pemandu@moh.gov.my" required class="w-full border p-2 rounded">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Gred Jawatan</label>
              <input type="text" id="gred" placeholder="H11" required class="w-full border p-2 rounded">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">PTJ / Hospital</label>
              <input type="text" id="ptj" required class="w-full border p-2 rounded">
            </div>
          </div>

          <!-- PENGELASAN LESEN -->
          <div>
            <label class="block text-sm font-semibold mb-1">Jenis Utama Lesen Vokasional (Pekeliling)</label>
            <select id="jenisLesen" onchange="kemaskiniMedanLesen()" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 mb-3">
              <option value="Tiada">Tiada (Belum Memiliki Lesen Vokasional)</option>
              <option value="GDL">GDL (Goods Driving Licence)</option>
              <option value="PSV">PSV (Public Service Vehicle)</option>
              <option value="GDL & PSV">GDL & PSV (Kedua-dua)</option>
            </select>

            <label class="block text-xs font-semibold text-slate-600 mb-2">Kelas Lesen CDL / Biasa Dimiliki (Tanda jika ada):</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 border p-3 rounded bg-slate-50">
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="B2" class="rounded"> B2 (Motosikal)</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="B Full" class="rounded"> B Full</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="D" class="rounded"> D (Motokar/Kereta)</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="DA" class="rounded"> DA (Auto)</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="E" class="rounded"> E (Lori/Bas)</label>
              <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="lesenOpt" value="Lain-lain" class="rounded"> Lain-lain</label>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Penglibatan Ambulans Gantian</label>
              <select id="ambulansGantian" class="w-full border p-2 rounded">
                <option value="Ya">Ya</option>
                <option value="Tidak">Tidak</option>
              </select>
            </div>
            <div id="boxNoLesen">
              <label class="block text-sm font-semibold mb-1">No. Lesen Vokasional</label>
              <input type="text" id="noLesen" class="w-full border p-2 rounded">
            </div>
          </div>

          <div id="boxTarikhLuput">
            <label class="block text-sm font-semibold mb-1">Tarikh Luput Lesen Vokasional</label>
            <input type="date" id="tarikhLuput" class="w-full border p-2 rounded">
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition no-print">
            Hantar Data Pemandu
          </button>
        </form>
      </div>
    </main>

  </div>

  <script>
    // GANTIKAN DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbyrMM6S70L21T2zIlmofPs1KbulEObqJYBZLjisHtwSBnzimfdryHGe4zPZUDR2ssOs/exec";
    let currentUser = null;

    function kemaskiniMedanLesen() {
      const v = document.getElementById('jenisLesen').value;
      const noLesenInput = document.getElementById('noLesen');
      const tarikhLuputInput = document.getElementById('tarikhLuput');

      if (v === "Tiada") {
        noLesenInput.value = "Tiada";
        noLesenInput.disabled = true;
        tarikhLuputInput.value = "";
        tarikhLuputInput.disabled = true;
      } else {
        if (noLesenInput.value === "Tiada") noLesenInput.value = "";
        noLesenInput.disabled = false;
        tarikhLuputInput.disabled = false;
      }
    }

    // LOG MASUK (NEUTRAL CASE)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const usernameVal = document.getElementById('loginUsername').value.trim();
      const passwordVal = document.getElementById('loginPassword').value.trim();

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "login", username: usernameVal, password: passwordVal })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "Log Masuk";
        btn.disabled = false;

        if (data.success) {
          currentUser = data;
          document.getElementById('loginModal').classList.add('hidden');
          document.getElementById('appContainer').classList.remove('hidden');
          document.getElementById('userNamaDisplay').innerText = `${data.nama} (${data.role})`;

          if (data.role === "Penyelia") {
            document.getElementById('sidebarAnalitik').classList.remove('hidden');
            kemaskiniDashboard();
          } else {
            document.getElementById('sidebarAnalitik').classList.add('hidden');
            document.getElementById('idPemandu').value = data.username;
          }
          kemaskiniMedanLesen();
        } else {
          document.getElementById('loginError').classList.remove('hidden');
        }
      })
      .catch(err => {
        btn.innerText = "Log Masuk";
        btn.disabled = false;
        alert("Ralat sambungan: " + err);
      });
    });

    function logKeluar() {
      location.reload();
    }

    function kemaskiniDashboard() {
      fetch(`${SCRIPT_URL}?action=getAnalitik`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('statJumlahPemandu').innerText = data.jumlahPemandu;
          document.getElementById('statAmbulansGantian').innerText = data.pemanduAmbulansGantian;
          document.getElementById('statTiadaLesen').innerText = data.tiadaLesenVokasional;
          document.getElementById('statLesenLuput').innerText = data.lesenLuput;
        })
        .catch(err => console.log("Gagal muat analitik:", err));
    }

    function muatTurunAnalitik() {
      const jPemandu = document.getElementById('statJumlahPemandu').innerText;
      const jAmbulans = document.getElementById('statAmbulansGantian').innerText;
      const jTiada = document.getElementById('statTiadaLesen').innerText;
      const jLuput = document.getElementById('statLesenLuput').innerText;

      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "RINGKASAN ANALISIS PEMANDU & LESEN VOKASIONAL KKM\n";
      csvContent += `Tarikh Cetakan,${new Date().toLocaleDateString('ms-MY')}\n\n`;
      csvContent += "Metrik,Nilai\n";
      csvContent += `Jumlah Pemandu Berdaftar,${jPemandu}\n`;
      csvContent += `Pemandu Terlibat Ambulans Gantian,${jAmbulans}\n`;
      csvContent += `Belum Memiliki Lesen Vokasional,${jTiada}\n`;
      csvContent += `Lesen Tamat Tempoh,${jLuput}\n`;

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Laporan_Analisis_Pemandu_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // SIMPAN DATA PEMANDU
    document.getElementById('pemanduForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const utamaLesen = document.getElementById('jenisLesen').value;
      const lesenTambahan = Array.from(document.querySelectorAll('input[name="lesenOpt"]:checked'))
                                 .map(cb => cb.value);
      
      let gabungLesen = utamaLesen;
      if (lesenTambahan.length > 0) {
        gabungLesen += ` (${lesenTambahan.join(', ')})`;
      }

      const noLesenVal = document.getElementById('noLesen').value || "Tiada";
      const tarikhLuputVal = document.getElementById('tarikhLuput').value || "Tiada";

      const payload = {
        action: "simpanPemandu",
        idPemandu: document.getElementById('idPemandu').value,
        nama: document.getElementById('nama').value,
        noKP: document.getElementById('noKP').value,
        noTel: document.getElementById('noTel').value,
        emel: document.getElementById('emel').value,
        gred: document.getElementById('gred').value,
        ptj: document.getElementById('ptj').value,
        ambulansGantian: document.getElementById('ambulansGantian').value,
        jenisLesen: gabungLesen,
        noLesen: noLesenVal,
        tarikhLuput: tarikhLuputVal,
        statusLesen: utamaLesen === "Tiada" ? "Belum Memiliki" : "Aktif"
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert('Data pemandu berjaya dihantar!');
        document.getElementById('pemanduForm').reset();
        kemaskiniMedanLesen();
        if (currentUser && currentUser.role === "Penyelia") {
          setTimeout(kemaskiniDashboard, 2000);
        }
      })
      .catch(error => alert('Ralat: ' + error));
    });
  </script>
</body>
</html>
